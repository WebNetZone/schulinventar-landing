<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" fill="none" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <linearGradient id="ausbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f7faff"/>
    </linearGradient>
    <linearGradient id="ausblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3880ff"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <filter id="ausShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#2f6fe0" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="380" height="300" rx="28" fill="url(#ausbg)"/>
  <circle cx="320" cy="70" r="74" fill="#3880ff" opacity="0.06"/>
  <circle cx="58" cy="240" r="60" fill="#3880ff" opacity="0.06"/>

  <!-- Gerät -->
  <g filter="url(#ausShadow)">
    <rect x="52" y="76" width="100" height="100" rx="22" fill="#ffffff"/>
  </g>
  <rect x="72" y="100" width="60" height="42" rx="6" fill="#eef4ff" stroke="#3880ff" stroke-width="2.6"/>
  <rect x="66" y="146" width="72" height="8" rx="4" fill="#3880ff"/>
  <text x="102" y="170" font-size="11" font-weight="700" fill="#7c89a3" text-anchor="middle">Gerät</text>

  <!-- Pfeil -->
  <path d="M166 126h44" stroke="#3880ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M206 118l12 8-12 8" fill="none" stroke="#3880ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Person -->
  <g filter="url(#ausShadow)">
    <rect x="228" y="76" width="100" height="100" rx="22" fill="url(#ausblue)"/>
  </g>
  <circle cx="278" cy="112" r="15" fill="#ffffff"/>
  <path d="M256 154a22 22 0 0144 0z" fill="#ffffff"/>

  <!-- Erledigt-Haken -->
  <g filter="url(#ausShadow)">
    <circle cx="322" cy="166" r="19" fill="#1eb85f"/>
  </g>
  <path d="M314 166l5 5 11-11" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Titel -->
  <text x="190" y="226" font-size="18" font-weight="800" fill="#1f2a44" text-anchor="middle">Geräte schnell verleihen</text>
  <text x="190" y="248" font-size="12.5" fill="#7c89a3" text-anchor="middle">Ausleihen mit einem Tippen – sofort verbucht</text>
</svg>
