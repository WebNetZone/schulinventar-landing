<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" fill="none" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <linearGradient id="exbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f7faff"/>
    </linearGradient>
    <filter id="exShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f6fe0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="380" height="300" rx="28" fill="url(#exbg)"/>
  <circle cx="320" cy="200" r="70" fill="#3880ff" opacity="0.07"/>

  <!-- Klassensatz-Label -->
  <rect x="46" y="42" width="128" height="24" rx="12" fill="#dbe7ff"/>
  <text x="110" y="59" font-size="12" font-weight="700" fill="#2f6fe0" text-anchor="middle">Klassensatz · 24×</text>

  <!-- Exemplar 1 -->
  <g filter="url(#exShadow)">
    <rect x="46" y="80" width="288" height="46" rx="14" fill="#ffffff"/>
  </g>
  <rect x="60" y="92" width="22" height="22" rx="5" fill="#1f2a44"/>
  <g fill="#ffffff"><rect x="65" y="97" width="5" height="5" rx="1"/><rect x="73" y="97" width="5" height="5" rx="1"/><rect x="65" y="105" width="5" height="5" rx="1"/><rect x="74" y="106" width="3" height="3"/></g>
  <rect x="94" y="95" width="72" height="8" rx="4" fill="#1f2a44"/>
  <rect x="94" y="108" width="44" height="6" rx="3" fill="#aab6cc"/>
  <rect x="238" y="93" width="80" height="20" rx="10" fill="#e3f9ec"/>
  <circle cx="252" cy="103" r="3.4" fill="#1eb85f"/>
  <text x="262" y="107" font-size="10" font-weight="700" fill="#15a052">Raum 204</text>

  <!-- Exemplar 2 -->
  <g filter="url(#exShadow)">
    <rect x="46" y="134" width="288" height="46" rx="14" fill="#ffffff"/>
  </g>
  <rect x="60" y="146" width="22" height="22" rx="5" fill="#1f2a44"/>
  <g fill="#ffffff"><rect x="65" y="151" width="5" height="5" rx="1"/><rect x="73" y="151" width="5" height="5" rx="1"/><rect x="65" y="159" width="5" height="5" rx="1"/><rect x="74" y="160" width="3" height="3"/></g>
  <rect x="94" y="149" width="66" height="8" rx="4" fill="#1f2a44"/>
  <rect x="94" y="162" width="52" height="6" rx="3" fill="#aab6cc"/>
  <rect x="238" y="147" width="80" height="20" rx="10" fill="#fdeede"/>
  <circle cx="252" cy="157" r="3.4" fill="#f0992b"/>
  <text x="262" y="161" font-size="10" font-weight="700" fill="#d97f17">Verliehen</text>

  <!-- Exemplar 3: defekt -->
  <g filter="url(#exShadow)">
    <rect x="46" y="188" width="288" height="46" rx="14" fill="#ffffff"/>
  </g>
  <rect x="60" y="200" width="22" height="22" rx="5" fill="#1f2a44"/>
  <g fill="#ffffff"><rect x="65" y="205" width="5" height="5" rx="1"/><rect x="73" y="205" width="5" height="5" rx="1"/><rect x="65" y="213" width="5" height="5" rx="1"/><rect x="74" y="214" width="3" height="3"/></g>
  <rect x="94" y="203" width="58" height="8" rx="4" fill="#1f2a44"/>
  <rect x="94" y="216" width="48" height="6" rx="3" fill="#aab6cc"/>
  <rect x="248" y="201" width="70" height="20" rx="10" fill="#fde8e8"/>
  <circle cx="262" cy="211" r="3.4" fill="#e0574a"/>
  <text x="272" y="215" font-size="10" font-weight="700" fill="#c93c30">Defekt</text>

  <text x="190" y="266" font-size="18" font-weight="800" fill="#1f2a44" text-anchor="middle">Jedes Exemplar einzeln</text>
  <text x="190" y="286" font-size="12.5" fill="#7c89a3" text-anchor="middle">Eigener Code, Standort und Status</text>
