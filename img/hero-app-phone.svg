<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 780" fill="none" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f7faff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3880ff"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <filter id="phoneShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1f2a44" flood-opacity="0.18"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2f6fe0" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="440" height="780" rx="36" fill="url(#bg)"/>
  <circle cx="372" cy="120" r="120" fill="#3880ff" opacity="0.06"/>
  <circle cx="70" cy="690" r="96" fill="#3880ff" opacity="0.07"/>

  <!-- Telefon -->
  <g filter="url(#phoneShadow)">
    <rect x="70" y="70" width="300" height="640" rx="46" fill="#1f2a44"/>
    <rect x="82" y="82" width="276" height="616" rx="36" fill="#ffffff"/>
  </g>

  <!-- Kamera-Pille -->
  <rect x="188" y="92" width="64" height="14" rx="7" fill="#1f2a44"/>

  <!-- Statusleiste -->
  <text x="104" y="128" font-size="12" font-weight="700" fill="#1f2a44">9:41</text>
  <g fill="#1f2a44">
    <rect x="300" y="120" width="4" height="8" rx="1.5"/>
    <rect x="306" y="117" width="4" height="11" rx="1.5"/>
    <rect x="312" y="114" width="4" height="14" rx="1.5"/>
    <rect x="322" y="115" width="20" height="11" rx="3" opacity="0.35"/>
    <rect x="324" y="117" width="14" height="7" rx="1.5"/>
  </g>

  <!-- App-Kopf -->
  <text x="104" y="170" font-size="23" font-weight="800" fill="#1f2a44">Inventar</text>
  <circle cx="332" cy="160" r="15" fill="#dbe7ff"/>
  <circle cx="332" cy="155" r="5" fill="#3880ff"/>
  <path d="M324 168a8 8 0 0116 0z" fill="#3880ff"/>

  <!-- Suchleiste -->
  <rect x="104" y="186" width="232" height="38" rx="19" fill="#f1f5fc" stroke="#e2eafc"/>
  <circle cx="126" cy="205" r="6.5" fill="none" stroke="#9bb4e0" stroke-width="2"/>
  <line x1="131" y1="210" x2="136" y2="215" stroke="#9bb4e0" stroke-width="2" stroke-linecap="round"/>
  <text x="146" y="209" font-size="12" fill="#9bb4e0">Gerät suchen …</text>

  <!-- Karte 1 -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="242" width="240" height="70" rx="16" fill="#ffffff" stroke="#eef2f9"/>
  </g>
  <rect x="112" y="254" width="46" height="46" rx="12" fill="#eef4ff"/>
  <g stroke="#3880ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="122" y="266" width="26" height="17" rx="2"/>
    <line x1="118" y1="289" x2="152" y2="289"/>
  </g>
  <text x="168" y="270" font-size="13" font-weight="700" fill="#1f2a44">Beamer Epson</text>
  <text x="168" y="289" font-size="11.5" fill="#7c89a3">Beamer</text>
  <rect x="258" y="267" width="72" height="20" rx="10" fill="#e3f9ec"/>
  <circle cx="271" cy="277" r="3.2" fill="#1eb85f"/>
  <text x="280" y="281" font-size="9.5" font-weight="700" fill="#15a052">Verfügbar</text>

  <!-- Karte 2 -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="322" width="240" height="70" rx="16" fill="#ffffff" stroke="#eef2f9"/>
  </g>
  <rect x="112" y="334" width="46" height="46" rx="12" fill="#eef4ff"/>
  <g stroke="#3880ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="126" y="343" width="18" height="28" rx="3"/>
  </g>
  <circle cx="135" cy="366" r="1.6" fill="#3880ff"/>
  <text x="168" y="350" font-size="13" font-weight="700" fill="#1f2a44">iPad 10. Gen</text>
  <text x="168" y="369" font-size="11.5" fill="#7c89a3">Tablets</text>
  <rect x="258" y="347" width="72" height="20" rx="10" fill="#fdeede"/>
  <circle cx="271" cy="357" r="3.2" fill="#f0992b"/>
  <text x="280" y="361" font-size="9.5" font-weight="700" fill="#d97f17">Verliehen</text>

  <!-- Karte 3 -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="402" width="240" height="70" rx="16" fill="#ffffff" stroke="#eef2f9"/>
  </g>
  <rect x="112" y="414" width="46" height="46" rx="12" fill="#eef4ff"/>
  <g stroke="#3880ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="122" y="426" width="26" height="17" rx="2"/>
    <line x1="118" y1="449" x2="152" y2="449"/>
  </g>
  <text x="168" y="430" font-size="13" font-weight="700" fill="#1f2a44">ThinkPad L14</text>
  <text x="168" y="449" font-size="11.5" fill="#7c89a3">Notebooks</text>
  <rect x="258" y="427" width="72" height="20" rx="10" fill="#e3f9ec"/>
  <circle cx="271" cy="437" r="3.2" fill="#1eb85f"/>
  <text x="280" y="441" font-size="9.5" font-weight="700" fill="#15a052">Verfügbar</text>

  <!-- Karte 4 -->
  <g filter="url(#cardShadow)">
    <rect x="100" y="482" width="240" height="70" rx="16" fill="#ffffff" stroke="#eef2f9"/>
  </g>
  <rect x="112" y="494" width="46" height="46" rx="12" fill="#eef4ff"/>
  <g stroke="#3880ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M124 504h12a4 4 0 014 4v22a4 4 0 00-4-4h-12z"/>
    <path d="M146 504h-2"/>
  </g>
  <text x="168" y="510" font-size="13" font-weight="700" fill="#1f2a44">Deutschbuch</text>
  <text x="168" y="529" font-size="11.5" fill="#7c89a3">Bücher</text>
  <rect x="258" y="507" width="72" height="20" rx="10" fill="#fdeede"/>
  <circle cx="271" cy="517" r="3.2" fill="#f0992b"/>
  <text x="280" y="521" font-size="9.5" font-weight="700" fill="#d97f17">Verliehen</text>

  <!-- QR-Aktionsknopf -->
  <g filter="url(#cardShadow)">
    <circle cx="318" cy="588" r="27" fill="url(#header)"/>
  </g>
  <g fill="#ffffff">
    <rect x="306" y="576" width="9" height="9" rx="2"/>
    <rect x="321" y="576" width="9" height="9" rx="2"/>
    <rect x="306" y="591" width="9" height="9" rx="2"/>
    <rect x="322" y="592" width="4" height="4" rx="1"/>
    <rect x="328" y="592" width="2" height="2"/>
    <rect x="322" y="598" width="8" height="2"/>
  </g>

  <!-- Tab-Leiste -->
  <rect x="82" y="638" width="276" height="60" fill="#ffffff"/>
  <line x1="82" y1="638" x2="358" y2="638" stroke="#eef2f9" stroke-width="1.5"/>
  <rect x="118" y="654" width="20" height="18" rx="3" fill="none" stroke="#3880ff" stroke-width="2.2"/>
  <path d="M118 662l10-8 10 8" fill="none" stroke="#3880ff" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="128" y="688" font-size="9" font-weight="700" fill="#3880ff" text-anchor="middle">Start</text>
  <g fill="none" stroke="#aab6cc" stroke-width="2.2">
    <rect x="184" y="654" width="20" height="18" rx="3"/>
    <line x1="189" y1="660" x2="199" y2="660"/>
    <line x1="189" y1="666" x2="199" y2="666"/>
  </g>
  <text x="194" y="688" font-size="9" font-weight="600" fill="#aab6cc" text-anchor="middle">Inventar</text>
  <g fill="none" stroke="#aab6cc" stroke-width="2.2" stroke-linecap="round">
    <path d="M239 672a8 8 0 0114 0"/>
    <circle cx="246" cy="656" r="4"/>
  </g>
  <text x="248" y="688" font-size="9" font-weight="600" fill="#aab6cc" text-anchor="middle">Ausleihe</text>
  <g fill="none" stroke="#aab6cc" stroke-width="2.2">
    <circle cx="304" cy="658" r="5"/>
    <path d="M296 674a8 8 0 0116 0"/>
  </g>
  <text x="304" y="688" font-size="9" font-weight="600" fill="#aab6cc" text-anchor="middle">Profil</text>
</svg>
