<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" fill="none" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <linearGradient id="qrbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f7faff"/>
    </linearGradient>
    <filter id="qrShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f6fe0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="380" height="300" rx="28" fill="url(#qrbg)"/>
  <circle cx="312" cy="64" r="70" fill="#3880ff" opacity="0.07"/>

  <!-- Scan-Karte -->
  <g filter="url(#qrShadow)">
    <rect x="118" y="56" width="170" height="170" rx="26" fill="#ffffff"/>
  </g>

  <!-- QR-Code -->
  <g transform="translate(148 86)">
    <!-- Finder oben links -->
    <rect x="0" y="0" width="30" height="30" rx="5" fill="#1f2a44"/>
    <rect x="6" y="6" width="18" height="18" rx="3" fill="#ffffff"/>
    <rect x="10" y="10" width="10" height="10" rx="2" fill="#1f2a44"/>
    <!-- Finder oben rechts -->
    <rect x="80" y="0" width="30" height="30" rx="5" fill="#1f2a44"/>
    <rect x="86" y="6" width="18" height="18" rx="3" fill="#ffffff"/>
    <rect x="90" y="10" width="10" height="10" rx="2" fill="#1f2a44"/>
    <!-- Finder unten links -->
    <rect x="0" y="80" width="30" height="30" rx="5" fill="#1f2a44"/>
    <rect x="6" y="86" width="18" height="18" rx="3" fill="#ffffff"/>
    <rect x="10" y="90" width="10" height="10" rx="2" fill="#1f2a44"/>
    <!-- Module -->
    <g fill="#1f2a44">
      <rect x="42" y="2" width="8" height="8" rx="1.5"/>
      <rect x="58" y="2" width="8" height="8" rx="1.5"/>
      <rect x="42" y="14" width="8" height="8" rx="1.5"/>
      <rect x="68" y="14" width="8" height="8" rx="1.5"/>
      <rect x="2" y="42" width="8" height="8" rx="1.5"/>
      <rect x="14" y="42" width="8" height="8" rx="1.5"/>
      <rect x="42" y="42" width="8" height="8" rx="1.5"/>
      <rect x="58" y="42" width="8" height="8" rx="1.5"/>
      <rect x="74" y="42" width="8" height="8" rx="1.5"/>
      <rect x="92" y="42" width="8" height="8" rx="1.5"/>
      <rect x="42" y="58" width="8" height="8" rx="1.5"/>
      <rect x="68" y="58" width="8" height="8" rx="1.5"/>
      <rect x="88" y="58" width="8" height="8" rx="1.5"/>
      <rect x="42" y="74" width="8" height="8" rx="1.5"/>
      <rect x="58" y="74" width="8" height="8" rx="1.5"/>
      <rect x="74" y="74" width="8" height="8" rx="1.5"/>
      <rect x="42" y="90" width="8" height="8" rx="1.5"/>
      <rect x="62" y="90" width="8" height="8" rx="1.5"/>
      <rect x="88" y="74" width="8" height="8" rx="1.5"/>
      <rect x="88" y="90" width="8" height="8" rx="1.5"/>
    </g>
  </g>

  <!-- Scan-Ecken -->
  <g stroke="#3880ff" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M132 96v-12a8 8 0 018-8h12"/>
    <path d="M274 96v-12a8 8 0 00-8-8h-12"/>
    <path d="M132 186v12a8 8 0 008 8h12"/>
    <path d="M274 186v12a8 8 0 01-8 8h-12"/>
  </g>
  <!-- Scan-Linie -->
  <rect x="138" y="139" width="130" height="4" rx="2" fill="#3880ff" opacity="0.55"/>

  <!-- Erfolg-Badge -->
  <g filter="url(#qrShadow)">
    <circle cx="278" cy="206" r="22" fill="#1eb85f"/>
  </g>
  <path d="M269 206l6 6 12-12" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Titel -->
  <text x="190" y="262" font-size="18" font-weight="800" fill="#1f2a44" text-anchor="middle">Scannen &amp; ausleihen</text>
  <text x="190" y="282" font-size="12.5" fill="#7c89a3" text-anchor="middle">QR-Code scannen – in Sekunden verbucht</text>
</svg>
