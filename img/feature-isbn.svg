<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" fill="none" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif">
  <defs>
    <linearGradient id="isbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="1" stop-color="#f7faff"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3880ff"/>
      <stop offset="1" stop-color="#2f6fe0"/>
    </linearGradient>
    <filter id="isShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2f6fe0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="380" height="300" rx="28" fill="url(#isbg)"/>
  <circle cx="316" cy="66" r="66" fill="#3880ff" opacity="0.07"/>

  <!-- Buchrücken mit Barcode -->
  <g filter="url(#isShadow)">
    <rect x="46" y="60" width="118" height="150" rx="12" fill="#ffffff"/>
  </g>
  <rect x="46" y="60" width="14" height="150" rx="6" fill="#dbe7ff"/>
  <g fill="#1f2a44">
    <rect x="76" y="150" width="3" height="34" rx="1"/>
    <rect x="82" y="150" width="6" height="34" rx="1"/>
    <rect x="92" y="150" width="3" height="34" rx="1"/>
    <rect x="98" y="150" width="4" height="34" rx="1"/>
    <rect x="106" y="150" width="7" height="34" rx="1"/>
    <rect x="117" y="150" width="3" height="34" rx="1"/>
    <rect x="124" y="150" width="5" height="34" rx="1"/>
    <rect x="133" y="150" width="3" height="34" rx="1"/>
    <rect x="140" y="150" width="6" height="34" rx="1"/>
  </g>
  <text x="111" y="196" font-size="9" font-weight="700" fill="#7c89a3" text-anchor="middle">978-3-12-345678-9</text>
  <g fill="#cdd8ea">
    <rect x="72" y="82" width="78" height="7" rx="3.5"/>
    <rect x="72" y="96" width="58" height="7" rx="3.5"/>
  </g>

  <!-- Scan-Strahl -->
  <rect x="60" y="164" width="94" height="4" rx="2" fill="#3880ff" opacity="0.55"/>

  <!-- Pfeil -->
  <path d="M178 134h26m0 0l-8-8m8 8l-8 8" stroke="#9bb4e0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Ergebnis: Cover + Daten -->
  <g filter="url(#isShadow)">
    <rect x="220" y="72" width="112" height="126" rx="16" fill="#ffffff"/>
  </g>
  <rect x="234" y="86" width="54" height="72" rx="6" fill="url(#cover)"/>
  <g fill="#ffffff" opacity=".9">
    <rect x="242" y="100" width="34" height="4" rx="2"/>
    <rect x="242" y="110" width="26" height="4" rx="2"/>
    <rect x="242" y="136" width="20" height="3" rx="1.5"/>
  </g>
  <g fill="#cdd8ea">
    <rect x="298" y="90" width="22" height="6" rx="3"/>
    <rect x="298" y="104" width="18" height="6" rx="3"/>
  </g>
  <g fill="#1f2a44">
    <rect x="234" y="170" width="84" height="8" rx="4"/>
  </g>
  <rect x="234" y="184" width="52" height="6" rx="3" fill="#aab6cc"/>

  <!-- Erfolg -->
  <g filter="url(#isShadow)">
    <circle cx="326" cy="188" r="20" fill="#1eb85f"/>
  </g>
  <path d="M318 188l5.5 5.5L334 183" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <text x="190" y="262" font-size="18" font-weight="800" fill="#1f2a44" text-anchor="middle">Buch per ISBN</text>
  <text x="190" y="282" font-size="12.5" fill="#7c89a3" text-anchor="middle">Titel, Autor und Cover kommen automatisch</text>
</svg>
